version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: empowerplant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: empowerplant_root_password
      MYSQL_DATABASE: empowerplant
      MYSQL_USER: empowerplant_user
      MYSQL_PASSWORD: empowerplant_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - empowerplant-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: empowerplant-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - empowerplant-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: empowerplant-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - empowerplant-network

  # Apache Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: empowerplant-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
    networks:
      - empowerplant-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kafka UI (optional, for development)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: empowerplant-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: empowerplant
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - empowerplant-network

  # User Management Service
  user-management:
    build:
      context: ../../backend
      dockerfile: microservices/user-management/Dockerfile
    container_name: empowerplant-user-management
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      - APP_ENVIRONMENT=development
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=3000
      - APP_DATABASE__URL=mysql://empowerplant_user:empowerplant_password@mysql:3306/empowerplant
      - APP_KAFKA__BOOTSTRAP_SERVERS=kafka:29092
      - APP_KAFKA__GROUP_ID=user-management-service
      - APP_REDIS__URL=redis://redis:6379
      - APP_JWT__SECRET=your-super-secret-jwt-key-here
    volumes:
      - ../../backend:/app
    networks:
      - empowerplant-network
    restart: unless-stopped

  # Weather Data Service
  weather-data:
    build:
      context: ../../backend
      dockerfile: microservices/weather-data/Dockerfile
    container_name: empowerplant-weather-data
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3002:3000"
    environment:
      - APP_ENVIRONMENT=development
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=3000
      - APP_DATABASE__URL=mysql://empowerplant_user:empowerplant_password@mysql:3306/empowerplant
      - APP_KAFKA__BOOTSTRAP_SERVERS=kafka:29092
      - APP_KAFKA__GROUP_ID=weather-data-service
    volumes:
      - ../../backend:/app
    networks:
      - empowerplant-network
    restart: unless-stopped

  # Plant Monitoring Service
  plant-monitoring:
    build:
      context: ../../backend
      dockerfile: microservices/plant-monitoring/Dockerfile
    container_name: empowerplant-plant-monitoring
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3003:3000"
    environment:
      - APP_ENVIRONMENT=development
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=3000
      - APP_DATABASE__URL=mysql://empowerplant_user:empowerplant_password@mysql:3306/empowerplant
      - APP_KAFKA__BOOTSTRAP_SERVERS=kafka:29092
      - APP_KAFKA__GROUP_ID=plant-monitoring-service
    volumes:
      - ../../backend:/app
    networks:
      - empowerplant-network
    restart: unless-stopped

  # API Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: empowerplant-gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - user-management
      - weather-data
      - plant-monitoring
    networks:
      - empowerplant-network
    restart: unless-stopped

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: empowerplant-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - empowerplant-network
    restart: unless-stopped

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: empowerplant-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=empowerplant_admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - empowerplant-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  empowerplant-network:
    driver: bridge
