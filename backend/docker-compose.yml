version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: empowerplant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: empowerplant
      MYSQL_USER: empowerplant
      MYSQL_PASSWORD: empowerpass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - empowerplant-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: empowerplant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5
    networks:
      - empowerplant-network

  # Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: empowerplant-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - empowerplant-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: empowerplant-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      timeout: 10s
      retries: 10
    networks:
      - empowerplant-network

  # Weather Data Microservice
  weather-data:
    build:
      context: .
      dockerfile: microservices/weather-data/Dockerfile
    container_name: empowerplant-weather-data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=mysql://empowerplant:empowerpass123@mysql:3306/empowerplant
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - HOST=0.0.0.0
      - PORT=8081
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    networks:
      - empowerplant-network
    restart: unless-stopped

  # Plant Monitoring Microservice
  plant-monitoring:
    build:
      context: .
      dockerfile: microservices/plant-monitoring/Dockerfile
    container_name: empowerplant-plant-monitoring
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=mysql://empowerplant:empowerpass123@mysql:3306/empowerplant
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - HOST=0.0.0.0
      - PORT=8082
    networks:
      - empowerplant-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  empowerplant-network:
    driver: bridge
